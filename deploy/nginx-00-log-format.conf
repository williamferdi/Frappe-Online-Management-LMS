# Frappe's generated nginx config logs with the "main" format. The nginx.org
# default nginx.conf defines it; Ubuntu's does not. conf.d/*.conf is parsed in
# alphabetical order and access_log fails at parse time on an unknown format,
# so this must sort before frappe-bench.conf.
log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                '$status $body_bytes_sent "$http_referer" '
                '"$http_user_agent" "$http_x_forwarded_for"';
