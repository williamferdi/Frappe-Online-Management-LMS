			try {
				var stored = localStorage.getItem('sibbcs-theme')

					stored === 'dark' ||
					(stored !== 'light' &&
						window.matchMedia('(prefers-color-scheme: dark)').matches)

			} catch (e) {
				/* private mode; the default theme is fine */
